name: Windows PC

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar Docker
        uses: docker/setup-docker-action@v4

      - name: Criar docker-compose.yml
        run: |
          cat > docker-compose.yml <<'EOF'
          services:
            windows:
              container_name: windows
              image: ghcr.io/dockur/windows:latest
              restart: always

              environment:
                VERSION: "10"
                RAM_SIZE: "32G"
                CPU_CORES: "8"
                DISK_SIZE: "128G"

              devices:
                - /dev/kvm
                - /dev/net/tun

              cap_add:
                - NET_ADMIN

              ports:
                - "8006:8006"
                - "3389:3389"

              volumes:
                - ./windows:/storage
          EOF

      - name: Iniciar PC
        run: |
          docker compose up -d

      - name: Verificar
        run: |
          docker compose ps
          docker logs windows --tail 50
